; Erbaa Bilgi Eğitim masaüstü — gömülü PHP ayarları.
; Uygulama tüm PHP süreçlerine PHPRC=<paket>/runtime verir; böylece zamanlayıcının arka plana attığı
; `php artisan kurs:sync` alt süreçleri de bu dosyayı okur. Yol içeren ayarlar ortam değişkeninden gelir
; (${…} genişletmesi; değerleri src-tauri/src/php.rs › build_env üretir).

auto_prepend_file = "${KURS_PREPEND}"
error_log = "${KURS_PHP_ERROR_LOG}"
; Statik PHP sistem sertifika deposunu bilmez → paketle gelen Mozilla CA listesi (runtime/cacert.pem)
curl.cainfo = "${KURS_CACERT}"
openssl.cafile = "${KURS_CACERT}"

memory_limit = 512M
max_execution_time = 300
max_input_time = 120
upload_max_filesize = 64M
post_max_size = 64M
max_input_vars = 5000

; $_ENV dolu olsun (Laravel LARAVEL_STORAGE_PATH'i buradan okur)
variables_order = "EGPCS"
request_order = "GP"

date.timezone = Europe/Istanbul
default_charset = "UTF-8"
intl.default_locale = tr_TR
expose_php = Off

display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

; php -S statik dosyada sıkıştırma + Content-Length çakışması → tarayıcıda ERR_INVALID_HTTP_RESPONSE
zlib.output_compression = Off
output_buffering = 4096

; Sertleştirilmiş çalışma zamanı (hardened runtime): JIT belleği için yetki istemeyiz
pcre.jit = 0
opcache.enable = 1
opcache.enable_cli = 0
opcache.jit = disable
opcache.jit_buffer_size = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Paket dosyaları yalnız güncellemeyle değişir; güncelleme uygulamayı yeniden başlatır
opcache.validate_timestamps = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600

session.use_strict_mode = 1
allow_url_include = Off
