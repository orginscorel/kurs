<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Erbaa Kurs</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b1020; color: #e7ebf5;
      font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
    .wrap { display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; gap: 14px; text-align: center; padding: 24px; }
    .spin { width: 34px; height: 34px; border: 3px solid #2a3550; border-top-color: #5b8cff;
      border-radius: 50%; animation: s 0.9s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
    .t { font-size: 15px; opacity: .85; }
  </style>
</head>
<body>
  <!--
    Bu ekran yalnız ağ gelene kadar görünür. Uygulama açılışta canlı web uygulamasını
    (capacitor.config.json › server.url) yükler; böylece mobil her zaman güncel kalır.
  -->
  <div class="wrap">
    <div class="spin"></div>
    <div class="t">Erbaa Kurs yükleniyor…</div>
  </div>
</body>
</html>
