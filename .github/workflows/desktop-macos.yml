# Erbaa Kurs — macOS masaüstü uygulaması (imzalı + notarize DMG, otomatik güncelleme)
#
# Depo düzeni (varsayılan): kök = web uygulaması (Laravel), desktop/ = bu proje.
# Bu dosya depoda .github/workflows/desktop-macos.yml olarak durur. Belge: desktop/docs/DESKTOP.md
#
# Tetikleme:
#   - etiket:  git tag desktop-v0.2.0 && git push --tags      → derle, imzala, notarize et, GitHub Release yayımla
#   - elle:    Actions › desktop-macos › Run workflow           → derle (isteğe bağlı: imzasız / yayımla)
#
# Web kodu kaynağı (vars.KURS_APP_SOURCE):
#   repo    (varsayılan) aynı depo kökü
#   tarball sunucunun ürettiği imzalı arşiv: secrets.KURS_APP_TARBALL_URL + secrets.KURS_APP_TARBALL_SHA256
#   remote  ayrı özel depo: vars.KURS_APP_REPO (sahip/ad) + secrets.KURS_APP_REPO_TOKEN (salt okur)
name: desktop-macos

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      unsigned:
        description: 'Apple imzası ve notarization olmadan dene (Apple hesabı hazır değilken)'
        type: boolean
        default: false
      publish:
        description: 'GitHub Release olarak yayımla (etiket yoksa desktop-v<sürüm> oluşturur)'
        type: boolean
        default: false
      run_web_tests:
        description: 'Web uygulaması testlerini (php artisan test) çalıştır'
        type: boolean
        default: true

concurrency:
  group: desktop-macos-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SPC_VERSION: '2.8.5'
  PHP_VERSION: '8.4'
  NODE_VERSION: '22'
  MACOSX_DEPLOYMENT_TARGET: '12.0'
  KURS_APP_SOURCE: ${{ vars.KURS_APP_SOURCE || 'repo' }}

jobs:
  # Ayrı "Denetim" işi (cargo check + tsc) kaldırıldı: aynı denetimler build işinde zaten koşuyor (sürüm tutarlılığı
  # ilk adımda, tsc + vite `tauri build`'in beforeBuildCommand'ında, derleme cargo check'i kapsar). Her macOS işi en az
  # 1 dk (özel depoda ×10) faturalandığından ayrı iş yalnız dakika harcıyordu. clippy yalnız uyarıydı; yerelde çalıştırın.

  # ------------------------------------------------------------------ 1) statik PHP (mimari başına, önbellekli)
  # Önbellek isabetinde iş ~10 sn sürer (derleme adımı atlanır); x86_64 PHP Intel koşucu gerektirdiği için ayrı iş.
  php:
    name: Statik PHP ${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: aarch64
            runner: macos-14
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - id: dirs
        run: |
          if [ -f desktop/scripts/build-static-php.sh ]; then echo "d=desktop" >> "$GITHUB_OUTPUT"; else echo "d=." >> "$GITHUB_OUTPUT"; fi

      - id: cache
        uses: actions/cache@v4
        with:
          path: out/php-${{ matrix.arch }}-apple-darwin
          key: static-php-${{ matrix.arch }}-spc${{ env.SPC_VERSION }}-php${{ env.PHP_VERSION }}-${{ hashFiles(format('{0}/scripts/build-static-php.sh', steps.dirs.outputs.d)) }}

      - name: static-php-cli ile derle
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPC_WORK_DIR: ${{ runner.temp }}/spc
        run: bash "${{ steps.dirs.outputs.d }}/scripts/build-static-php.sh" "out/php-${{ matrix.arch }}-apple-darwin"

      - name: Önbellekteki ikiliyi doğrula
        run: |
          out/php-${{ matrix.arch }}-apple-darwin -v
          out/php-${{ matrix.arch }}-apple-darwin -r 'exit(extension_loaded("intl") && extension_loaded("pdo_sqlite") && extension_loaded("sodium") ? 0 : 1);'

  # ------------------------------------------------------------------ 2) Laravel paketi (vendor --no-dev + derlenmiş ön yüz)
  laravel:
    name: Laravel paketi
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        if: env.KURS_APP_SOURCE != 'remote'

      - uses: actions/checkout@v4
        if: env.KURS_APP_SOURCE == 'remote'
        with:
          path: desktop-src

      - uses: actions/checkout@v4
        if: env.KURS_APP_SOURCE == 'remote'
        with:
          repository: ${{ vars.KURS_APP_REPO }}
          token: ${{ secrets.KURS_APP_REPO_TOKEN }}
          path: web-src

      - id: dirs
        run: |
          case "$KURS_APP_SOURCE" in
            remote) echo "desktop=desktop-src" >> "$GITHUB_OUTPUT"; echo "web=web-src" >> "$GITHUB_OUTPUT" ;;
            *) if [ -f desktop/scripts/bundle-laravel.sh ]; then echo "desktop=desktop" >> "$GITHUB_OUTPUT"; else echo "desktop=." >> "$GITHUB_OUTPUT"; fi
               echo "web=." >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, intl, gd, zip, mbstring, sodium, pdo_sqlite, sqlite3, fileinfo, dom, xml, curl
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Erken ve ucuz (Linux) sürüm denetimi: tutarsızsa macOS dakikası harcanmadan durur; build işi yine denetler
      - name: Masaüstü sürüm tutarlılığı
        run: node "${{ steps.dirs.outputs.desktop }}/scripts/release.mjs" check

      - name: Web testleri
        if: env.KURS_APP_SOURCE != 'tarball' && (github.event_name == 'push' || inputs.run_web_tests)
        working-directory: ${{ steps.dirs.outputs.web }}
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          cp .env.example .env
          php artisan key:generate --force
          php artisan test --testsuite=Unit

      - name: Paketle
        env:
          KURS_APP_SOURCE: ${{ env.KURS_APP_SOURCE == 'tarball' && 'tarball' || 'dir' }}
          KURS_APP_DIR: ${{ github.workspace }}/${{ steps.dirs.outputs.web }}
          KURS_APP_TARBALL_URL: ${{ secrets.KURS_APP_TARBALL_URL }}
          KURS_APP_TARBALL_SHA256: ${{ secrets.KURS_APP_TARBALL_SHA256 }}
          OUT_DIR: ${{ runner.temp }}/laravel
        run: |
          # önceki adımın .env / vendor'u kopyaya girmez (betik hariç tutar)
          bash "${{ steps.dirs.outputs.desktop }}/scripts/bundle-laravel.sh"
          mkdir -p "$GITHUB_WORKSPACE/_bundle"
          tar -C "$OUT_DIR" -czf "$GITHUB_WORKSPACE/_bundle/laravel.tar.gz" .

      # Artifact yerine önbellek: hesap artifact kotası dolunca yükleme reddediliyordu
      - uses: actions/cache/save@v4
        with:
          path: _bundle/laravel.tar.gz
          key: laravel-bundle-${{ github.run_id }}
          enableCrossOsArchive: true

  # ------------------------------------------------------------------ 3) Tauri derleme + imza + notarization + yayın
  # DMG universal kalır; güncelleyici için ayrıca işlemciye özel (aarch64 / x86_64) ince .app arşivleri üretilir
  # (universal güncelleme 73 MB → ince ~40 MB). Süre: derleme ~11 dk + paralel notarization ~2-4 dk.
  build:
    name: macOS paketi (universal + işlemciye özel güncellemeler)
    needs: [php, laravel]
    runs-on: macos-14
    timeout-minutes: 90
    permissions:
      contents: write
    # DESKTOP_DIR ve VERSION ilk adımlarda $GITHUB_ENV'e yazılır (sonraki adımlarda ${{ env.* }} ile okunur)
    env:
      UNSIGNED: ${{ github.event_name == 'workflow_dispatch' && inputs.unsigned && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Masaüstü klasörü
        run: |
          if [ -f desktop/src-tauri/tauri.conf.json ]; then d=desktop; else d=.; fi
          echo "DESKTOP_DIR=$d" >> "$GITHUB_ENV"

      # Release yüklemesi: uploads.github.com büyük DMG'de ara sıra 504 veriyor → dosya başına yeniden dene
      - name: Yükleme yardımcısı
        run: |
          cat > "$RUNNER_TEMP/upload.sh" <<'SH'
          upload_with_retry() {
            local tag="$1" dir="$2" f n
            for f in "$dir"/*; do
              for n in 1 2 3 4 5; do
                if gh release upload "$tag" "$f" --clobber; then break; fi
                [ "$n" = 5 ] && { echo "::error::Yüklenemedi: $f"; return 1; }
                echo "::warning::Yükleme denemesi $n başarısız: $(basename "$f"); $((n * 20)) sn sonra tekrar"
                sleep $((n * 20))
              done
            done
          }
          SH
          echo "BASH_ENV=$RUNNER_TEMP/upload.sh" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.DESKTOP_DIR }}/package-lock.json

      - name: Sürüm tutarlılığı (package.json = tauri.conf = Cargo.toml = CHANGELOG)
        working-directory: ${{ env.DESKTOP_DIR }}
        run: |
          v="$(node scripts/release.mjs check)" # etiket ≠ sürüm de burada yakalanır
          [ -n "$v" ] || { echo "::error::Sürüm okunamadı"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "Sürüm: $v"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.DESKTOP_DIR }}/src-tauri -> target
          key: universal

      - uses: actions/cache/restore@v4
        with:
          path: _bundle/laravel.tar.gz
          key: laravel-bundle-${{ github.run_id }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - uses: actions/cache/restore@v4
        with:
          path: out/php-aarch64-apple-darwin
          key: static-php-aarch64-spc${{ env.SPC_VERSION }}-php${{ env.PHP_VERSION }}-${{ hashFiles(format('{0}/scripts/build-static-php.sh', env.DESKTOP_DIR)) }}
          fail-on-cache-miss: true

      - uses: actions/cache/restore@v4
        with:
          path: out/php-x86_64-apple-darwin
          key: static-php-x86_64-spc${{ env.SPC_VERSION }}-php${{ env.PHP_VERSION }}-${{ hashFiles(format('{0}/scripts/build-static-php.sh', env.DESKTOP_DIR)) }}
          fail-on-cache-miss: true

      - name: Gerekli sırlar
        env:
          HAS_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
          HAS_API: ${{ secrets.APPLE_API_KEY != '' }}
          HAS_UPDATER: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          missing=()
          if [ "$UNSIGNED" != "true" ]; then
            [ "$HAS_CERT" = "true" ] || missing+=("APPLE_CERTIFICATE (+ APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY)")
            [ "$HAS_API" = "true" ] || missing+=("APPLE_API_KEY (+ APPLE_API_KEY_ID, APPLE_API_ISSUER)")
          fi
          [ "$HAS_UPDATER" = "true" ] || missing+=("TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD)")
          # açık anahtar tauri.conf.json'da; vars.TAURI_UPDATER_PUBKEY verilirse onu ezer
          if [ -z "$PUBKEY" ] && grep -q YER_TUTUCU "$DESKTOP_DIR/src-tauri/tauri.conf.json"; then
            missing+=("güncelleyici açık anahtarı (tauri.conf.json ya da vars.TAURI_UPDATER_PUBKEY)")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            printf '::error::Eksik: %s\n' "${missing[@]}"
            echo "Ayrıntı: desktop/docs/DESKTOP.md › GitHub Secrets"
            exit 1
          fi

      - name: Paket içeriğini yerleştir
        working-directory: ${{ env.DESKTOP_DIR }}
        run: |
          W="$GITHUB_WORKSPACE"
          # Laravel
          rm -rf build/laravel && mkdir -p build/laravel
          tar -xzf "$W/_bundle/laravel.tar.gz" -C build/laravel
          # Statik PHP: universal ikili (Tauri universal hedefinde php-universal-apple-darwin arar)
          mkdir -p src-tauri/binaries
          cp "$W/out/php-aarch64-apple-darwin" src-tauri/binaries/
          cp "$W/out/php-x86_64-apple-darwin" src-tauri/binaries/
          lipo -create -output src-tauri/binaries/php-universal-apple-darwin \
            src-tauri/binaries/php-aarch64-apple-darwin src-tauri/binaries/php-x86_64-apple-darwin
          chmod 755 src-tauri/binaries/php-*
          lipo -info src-tauri/binaries/php-universal-apple-darwin
          # Mozilla CA listesi (statik PHP sistem deposunu görmez)
          curl -fsSL --retry 3 -o runtime/cacert.pem https://curl.se/ca/cacert.pem
          curl -fsSL --retry 3 https://curl.se/ca/cacert.pem.sha256 | awk '{print $1"  runtime/cacert.pem"}' | shasum -a 256 -c -
          # Güncelleyici açık anahtarı (gizli değil): değişken verilmişse conf'takini ezer
          [ -z "$PUBKEY" ] || node -e '
            const fs=require("fs"); const p="src-tauri/tauri.conf.json"; const c=JSON.parse(fs.readFileSync(p,"utf8"));
            c.plugins.updater.pubkey=process.env.PUBKEY; fs.writeFileSync(p, JSON.stringify(c,null,2));'
        env:
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}

      - name: Paketlenmiş PHP ile Laravel duman testi
        working-directory: ${{ env.DESKTOP_DIR }}
        run: |
          PHP="$PWD/src-tauri/binaries/php-universal-apple-darwin"
          T="${{ runner.temp }}/smoke"; mkdir -p "$T"/storage/{app/private,app/public,framework/cache/data,framework/sessions,framework/views,logs,fonts} "$T/cache"
          touch "$T/db.sqlite"
          export PHPRC="$PWD/runtime" PHP_INI_SCAN_DIR="" KURS_PREPEND="$PWD/runtime/prepend.php" KURS_CACERT="$PWD/runtime/cacert.pem" KURS_PHP_ERROR_LOG="$T/php-error.log"
          export LARAVEL_STORAGE_PATH="$T/storage" APP_SERVICES_CACHE="$T/cache/s.php" APP_PACKAGES_CACHE="$T/cache/p.php" KURS_PUBLIC_PATH="$PWD/build/laravel/public"
          APP_KEY="base64:$(head -c 32 /dev/urandom | base64)"
          export APP_KEY KURS_NODE=local DB_CONNECTION=sqlite DB_DATABASE="$T/db.sqlite" CACHE_STORE=file SESSION_DRIVER=file LOG_CHANNEL=stderr APP_ENV=production
          cd build/laravel
          "$PHP" artisan --version
          "$PHP" artisan migrate --force --no-interaction
          "$PHP" artisan kurs:sync --status --json
          # yerel sunucu + router + jeton
          TOKEN="$(openssl rand -hex 32)"
          KURS_DESKTOP_TOKEN_HASH="$(printf '%s' "$TOKEN" | shasum -a 256 | cut -d' ' -f1)"
          export KURS_DESKTOP_TOKEN_HASH PHP_CLI_SERVER_WORKERS=2
          "$PHP" -S 127.0.0.1:18080 -t public ../../runtime/router.php > "$T/server.log" 2>&1 &
          SRV=$!; sleep 3
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/up)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "X-Kurs-Desktop: $TOKEN" http://127.0.0.1:18080/up)" = 200
          curl -s --cookie "kurs_desktop=$TOKEN" http://127.0.0.1:18080/giris | grep -q 'kurs-node" content="local"'
          kill $SRV || true
          cat "$T/php-error.log" 2>/dev/null || true

      - name: Anahtar zinciri ve imza sertifikası
        if: env.UNSIGNED != 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          KC_PASS="$(openssl rand -hex 24)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" >/dev/null
          # shellcheck disable=SC2046 # mevcut anahtar zinciri listesi kelimelere bölünmeli
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KC"

      - name: App Store Connect API anahtarı
        if: env.UNSIGNED != 'true'
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/private_keys/AuthKey.p8"
          # base64 olarak eklendiyse çöz
          if ! grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/private_keys/AuthKey.p8"; then
            printf '%s' "$APPLE_API_KEY_CONTENT" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey.p8"
          fi
          grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/private_keys/AuthKey.p8"
          # Tauri notarization değişkenleri: APPLE_API_KEY = anahtar kimliği (Key ID), dosya APPLE_API_KEY_PATH.
          # İmzasız denemede hiç tanımlanmasınlar diye yalnız burada eklenir.
          {
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey.p8"
            echo "APPLE_API_KEY=$KEY_ID"
            echo "APPLE_API_ISSUER=$ISSUER"
            echo "APPLE_TEAM_ID=$TEAM_ID"
          } >> "$GITHUB_ENV"

      - name: Gömülü PHP'yi imzala (sertleştirilmiş çalışma zamanı)
        if: env.UNSIGNED != 'true'
        working-directory: ${{ env.DESKTOP_DIR }}
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          for f in src-tauri/binaries/php-*-apple-darwin; do
            codesign --force --timestamp --options runtime --entitlements src-tauri/Entitlements.plist --sign "$APPLE_SIGNING_IDENTITY" "$f"
            codesign --verify --strict --verbose=2 "$f"
          done

      - name: Tauri derle (universal)
        working-directory: ${{ env.DESKTOP_DIR }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # imzasız denemede "-" = ad-hoc imza (Gatekeeper uyarı verir, yalnız iç deneme)
          APPLE_SIGNING_IDENTITY: ${{ env.UNSIGNED != 'true' && secrets.APPLE_SIGNING_IDENTITY || '-' }}
        run: |
          npm ci
          npx tauri build --target universal-apple-darwin --ci

      - name: Çıktıları topla
        id: out
        working-directory: ${{ env.DESKTOP_DIR }}
        run: |
          B="src-tauri/target/universal-apple-darwin/release/bundle"
          ls -la "$B/macos" "$B/dmg"
          APP="$(find "$B/macos" -maxdepth 1 -name '*.app' | head -1)"
          DMG="$(find "$B/dmg" -maxdepth 1 -name '*.dmg' | head -1)"
          TGZ="$(find "$B/macos" -maxdepth 1 -name '*.app.tar.gz' | head -1)"
          SIG="$TGZ.sig"
          [ -f "$SIG" ] || { echo "::error::Güncelleyici imzası (.sig) oluşmadı"; exit 1; }
          D="${{ runner.temp }}/release"; mkdir -p "$D"
          # Dosya adları: boşluksuz, sürümlü
          cp "$DMG" "$D/ErbaaKurs_${VERSION}_universal.dmg"
          cp "$TGZ" "$D/ErbaaKurs_${VERSION}_universal.app.tar.gz"
          cp "$SIG" "$D/ErbaaKurs_${VERSION}_universal.app.tar.gz.sig"
          cp CHANGELOG.json "$D/CHANGELOG.json"
          {
            echo "app=$APP"
            echo "app_name=$(basename "$APP")"
            echo "dir=$D"
            echo "dmg=$D/ErbaaKurs_${VERSION}_universal.dmg"
            echo "thin=$RUNNER_TEMP/thin"
          } >> "$GITHUB_OUTPUT"

      # İmzalı + zımbalı universal .app'in kopyası: Mach-O dilimleri ayrılır (lipo -thin), imza içten dışa yeniden
      # atılır (önce Contents/MacOS/php, sonra paket; --deep yalnız doğrulamada). Gerekçe: scripts/thin-macos-app.sh
      - name: İşlemciye özel .app'ler (incelt + yeniden imzala)
        working-directory: ${{ env.DESKTOP_DIR }}
        env:
          SIGN_IDENTITY: ${{ env.UNSIGNED != 'true' && secrets.APPLE_SIGNING_IDENTITY || '-' }}
          ENTITLEMENTS: src-tauri/Entitlements.plist
        run: bash scripts/thin-macos-app.sh "${{ steps.out.outputs.app }}" "${{ steps.out.outputs.thin }}"

      # DMG + iki ince .app aynı anda gönderilir (--no-wait), hepsi beklenir, sonra zımbalanır
      - name: DMG imzala; DMG + ince .app'leri paralel notarize et, zımbala
        if: env.UNSIGNED != 'true'
        working-directory: ${{ env.DESKTOP_DIR }}
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          DMG="${{ steps.out.outputs.dmg }}"
          THIN="${{ steps.out.outputs.thin }}"
          NAME="${{ steps.out.outputs.app_name }}"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$DMG"
          bash scripts/notarize-parallel.sh "$DMG" "$THIN/aarch64/$NAME" "$THIN/x86_64/$NAME"

      # Tauri'nin universal arşiviyle aynı iç yapı: kökte "<Ad>.app/" (güncelleyici ilk bileşeni atlayıp açar).
      # macOS tar'ı AppleDouble (._*) / xattr eklemesin: açılan ._ dosyaları paketin imzasını bozar.
      - name: İşlemciye özel güncelleme arşivleri (.app.tar.gz + .sig)
        working-directory: ${{ env.DESKTOP_DIR }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -o pipefail # arka plandaki tar | gzip hattında tar hatası da yakalansın
          D="${{ steps.out.outputs.dir }}"
          THIN="${{ steps.out.outputs.thin }}"
          NAME="${{ steps.out.outputs.app_name }}"
          pids=()
          for arch in aarch64 x86_64; do
            ( cd "$THIN/$arch" && COPYFILE_DISABLE=1 tar --no-mac-metadata --no-xattrs -cf - "$NAME" ) | gzip -9n > "$D/ErbaaKurs_${VERSION}_${arch}.app.tar.gz" &
            pids+=($!)
          done
          for p in "${pids[@]}"; do wait "$p"; done
          for arch in aarch64 x86_64; do
            TGZ="$D/ErbaaKurs_${VERSION}_${arch}.app.tar.gz"
            L="$RUNNER_TEMP/$arch.list"; tar -tzf "$TGZ" > "$L"
            first="$(head -1 "$L")"
            [ "${first%/}" = "$NAME" ] || { echo "::error::$arch arşiv kökü beklenmedik: $first"; exit 1; }
            if grep -q '/\._' "$L"; then echo "::error::$arch arşivinde AppleDouble (._) dosyası var"; exit 1; fi
            # imza: tauri'nin universal arşiv için kullandığı araç ve anahtar (minisign, base64) — --help ÇAĞIRMA (anahtarı yazdırır)
            npx --no-install tauri signer sign "$TGZ" > /dev/null
            [ -s "$TGZ.sig" ] || { echo "::error::$arch imzası oluşmadı"; exit 1; }
            base64 --decode < "$TGZ.sig" | head -1 | grep -q '^untrusted comment:' || { echo "::error::$arch imza biçimi beklenmedik"; exit 1; }
          done
          ls -la "$D"
          echo "### Güncelleme paketleri" >> "$GITHUB_STEP_SUMMARY"
          (cd "$D" && du -h ./*.app.tar.gz ./*.dmg) | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"

      - name: İmza doğrulaması
        if: env.UNSIGNED != 'true'
        run: |
          APP="${{ env.DESKTOP_DIR }}/${{ steps.out.outputs.app }}"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP/Contents/MacOS/php" 2>&1 | grep -E "Authority|flags|TeamIdentifier"
          spctl --assess --type execute --verbose=4 "$APP"
          spctl --assess --type open --context context:primary-signature --verbose=4 "${{ steps.out.outputs.dmg }}"
          for arch in aarch64 x86_64; do
            T="${{ steps.out.outputs.thin }}/$arch/${{ steps.out.outputs.app_name }}"
            echo "== $arch: $(lipo -archs "$T/Contents/MacOS/php") / $(lipo -archs "$T/Contents/MacOS/erbaa-kurs")"
            codesign --verify --deep --strict --verbose=2 "$T"
            codesign -dv --verbose=4 "$T/Contents/MacOS/php" 2>&1 | grep -E "Identifier|Authority|flags|TeamIdentifier"
            xcrun stapler validate "$T"
            spctl --assess --type execute --verbose=4 "$T"
          done

      - name: Güncelleme bildirimi (latest.json)
        working-directory: ${{ env.DESKTOP_DIR }}
        run: |
          D="${{ steps.out.outputs.dir }}"
          node scripts/make-latest-json.mjs --version "$VERSION" --tag "desktop-v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --archive "$D/ErbaaKurs_${VERSION}_universal.app.tar.gz" --sig "$D/ErbaaKurs_${VERSION}_universal.app.tar.gz.sig" \
            --archive-aarch64 "$D/ErbaaKurs_${VERSION}_aarch64.app.tar.gz" --sig-aarch64 "$D/ErbaaKurs_${VERSION}_aarch64.app.tar.gz.sig" \
            --archive-x86_64 "$D/ErbaaKurs_${VERSION}_x86_64.app.tar.gz" --sig-x86_64 "$D/ErbaaKurs_${VERSION}_x86_64.app.tar.gz.sig" \
            --out "$D/latest.json"
          (cd "$D" && shasum -a 256 ./*.dmg ./*.tar.gz > SHA256SUMS.txt && cat SHA256SUMS.txt)

      # Artifact kotasına girmemek için deneme çıktıları taslak (draft) Release'e konur; taslaklar
      # etiket oluşturmaz, yalnız depo yetkilileri görür, kurs:desktop-release-sync bunları atlar.
      - name: Deneme çıktısı (taslak Release)
        if: ${{ !(env.UNSIGNED != 'true' && (startsWith(github.ref, 'refs/tags/desktop-v') || inputs.publish)) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="desktop-deneme-${GITHUB_RUN_NUMBER}"
          D="${{ steps.out.outputs.dir }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --prerelease --target "$GITHUB_SHA" \
            --title "Deneme #${GITHUB_RUN_NUMBER} — macOS $VERSION$([ "$UNSIGNED" = true ] && echo ' (imzasız)')" \
            --notes "Yayın dışı deneme derlemesi (çalışma ${GITHUB_RUN_ID})."
          upload_with_retry "$TAG" "$D"
          echo "Taslak: $TAG"

      - name: GitHub Release
        if: env.UNSIGNED != 'true' && (startsWith(github.ref, 'refs/tags/desktop-v') || inputs.publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="desktop-v$VERSION"
          D="${{ steps.out.outputs.dir }}"
          # shellcheck disable=SC2016 # node betiğindeki şablon dizesi
          NOTES="$(node -e 'const c=require(process.argv[1])[0]; const L={yeni:"Yeni",iyilestirme:"İyileştirme",duzeltme:"Düzeltme"}; console.log(`## ${c.title}\n\n`+c.items.map(i=>`- **${L[i.type]}:** ${i.text}`).join("\n"))' "$PWD/$DESKTOP_DIR/CHANGELOG.json")"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Erbaa Kurs macOS $VERSION" --notes "$NOTES" --target "$GITHUB_SHA"
          upload_with_retry "$TAG" "$D"
          echo "Yayımlandı: $TAG — sunucu 15 dk içinde çeker (php artisan kurs:desktop-release-sync ile hemen)."

      - name: Anahtar zincirini temizle
        if: always() && env.UNSIGNED != 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -rf "$RUNNER_TEMP/private_keys" || true
